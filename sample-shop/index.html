<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle">Sample Shop Website</title>
<meta name="description" content="">
<style>
  /* ====== CHANGE THESE 3 COLOURS PER CLIENT ====== */
  :root{
    --brand:#d9480f;      /* main colour (buttons, highlights) */
    --brand-dark:#a63a0c; /* hover colour */
    --soft:#fff4e6;       /* light background sections */
    --ink:#1f2933;
    --muted:#5f6b76;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);line-height:1.6;background:#fff}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;z-index:10}
  header .wrap{display:flex;justify-content:space-between;align-items:center;height:60px}
  .logo{font-weight:800;font-size:1.15rem;color:var(--brand)}
  .btn{display:inline-block;background:var(--brand);color:#fff;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:700;border:0;cursor:pointer;font-size:1rem}
  .btn:hover{background:var(--brand-dark)}
  .btn.small{padding:8px 16px;font-size:.9rem}
  .btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
  .hero{background:linear-gradient(135deg,var(--soft),#fff);padding:70px 0 60px;text-align:center}
  .hero h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.15;margin-bottom:14px}
  .hero p{color:var(--muted);font-size:1.15rem;max-width:620px;margin:0 auto 26px}
  .hero .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  section{padding:56px 0}
  section.alt{background:var(--soft)}
  h2{font-size:1.7rem;margin-bottom:8px;text-align:center}
  .sub{text-align:center;color:var(--muted);margin-bottom:30px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
  .card{background:#fff;border:1px solid #eee;border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  .card h3{margin-bottom:6px}
  .price{color:var(--brand);font-weight:800;font-size:1.2rem;margin:8px 0 14px}
  .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .gallery div{aspect-ratio:4/3;border-radius:14px;background:linear-gradient(135deg,#ffd8a8,#ffa94d) center/cover}
  .about{max-width:700px;margin:0 auto;text-align:center;font-size:1.08rem;color:var(--muted)}
  .review{font-style:italic}
  .review b{display:block;margin-top:10px;font-style:normal;color:var(--ink)}
  form{max-width:520px;margin:0 auto;display:grid;gap:12px}
  input,textarea,select{width:100%;padding:13px 14px;border:1px solid #d5dbe1;border-radius:12px;font:inherit}
  .contact-info{text-align:center;margin-top:24px;color:var(--muted)}
  footer{background:#1f2933;color:#cbd2d9;text-align:center;padding:26px 0;font-size:.9rem}
  .float{position:fixed;right:16px;bottom:16px;background:#25d366;color:#fff;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.7rem;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:20}
  @media(max-width:520px){.hero{padding:48px 0 40px}section{padding:40px 0}}
</style>
</head>
<body>

<script>
/* =========================================================
   EDIT ONLY THIS BLOCK FOR EACH NEW CLIENT. Nothing else.
   ========================================================= */
const SITE = {
  name: "Your Business Name",
  tagline: "Fresh homemade sweets and festival orders, delivered on time.",
  intro: "Order for Diwali, weddings, pujas and parties. Pure ingredients, fair prices.",
  whatsapp: "916289478817",       // country code + number, no + or spaces
  phoneDisplay: "+91 6289478817",
  address: "Chikkasandra, Bengaluru",
  hours: "Open daily, 9 AM to 9 PM",
  ctaText: "Order on WhatsApp",
  about: "We are a family-run shop with 15 years of experience. Everything is made fresh every morning. Tell us what you need and we will confirm price and delivery time on WhatsApp.",
  services: [
    { name: "Diwali Gift Box", price: "From ₹499", desc: "Assorted sweets in a festive box." },
    { name: "Party Catering", price: "From ₹250 / person", desc: "Snacks, sweets and full meals for 20+ guests." },
    { name: "Custom Orders", price: "Ask for price", desc: "Tell us your idea and budget." }
  ],
  photos: [ /* paste image links or file names like "photos/1.jpg" */ ],
  reviews: [
    { text: "Delivered on time and tasted amazing.", by: "Anita R." },
    { text: "Great price for a big order. Will order again.", by: "Suresh K." }
  ]
};
/* ========================================================= */
</script>

<header>
  <div class="wrap">
    <div class="logo" id="logo"></div>
    <a class="btn small" id="topBtn" target="_blank" rel="noopener"></a>
  </div>
</header>

<div class="hero">
  <div class="wrap">
    <h1 id="h1"></h1>
    <p id="intro"></p>
    <div class="btns">
      <a class="btn" id="heroBtn" target="_blank" rel="noopener"></a>
      <a class="btn ghost" href="#services">See services</a>
    </div>
  </div>
</div>

<section id="services">
  <div class="wrap">
    <h2>What we offer</h2>
    <p class="sub">Tap any item to order on WhatsApp.</p>
    <div class="grid" id="serviceGrid"></div>
  </div>
</section>

<section class="alt" id="aboutSec">
  <div class="wrap">
    <h2>About us</h2>
    <p class="about" id="about"></p>
  </div>
</section>

<section id="gallerySec">
  <div class="wrap">
    <h2>Our work</h2>
    <p class="sub">A few recent photos.</p>
    <div class="gallery" id="gallery"></div>
  </div>
</section>

<section class="alt" id="reviewSec">
  <div class="wrap">
    <h2>What customers say</h2>
    <p class="sub"></p>
    <div class="grid" id="reviewGrid"></div>
  </div>
</section>

<section id="contact">
  <div class="wrap">
    <h2>Place an order</h2>
    <p class="sub">Fill this in. It opens WhatsApp with your message ready to send.</p>
    <form id="orderForm">
      <input id="fName" placeholder="Your name" required>
      <select id="fItem"></select>
      <textarea id="fMsg" rows="3" placeholder="Quantity, date, address, anything else"></textarea>
      <button class="btn" type="submit"></button>
    </form>
    <div class="contact-info" id="contactInfo"></div>
  </div>
</section>

<footer><div class="wrap" id="footer"></div></footer>

<a class="float" id="floatBtn" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const wa = (text) => "https://wa.me/" + SITE.whatsapp + "?text=" + encodeURIComponent(text);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  document.title = SITE.name;
  document.querySelector('meta[name=description]').content = SITE.tagline;
  $('logo').textContent = SITE.name;
  $('h1').textContent = SITE.tagline;
  $('intro').textContent = SITE.intro;
  $('about').textContent = SITE.about;

  const hello = wa("Hi " + SITE.name + ", I want to place an order.");
  ["topBtn","heroBtn","floatBtn"].forEach(id => $(id).href = hello);
  $('topBtn').textContent = SITE.ctaText;
  $('heroBtn').textContent = SITE.ctaText;
  document.querySelector('#orderForm button').textContent = SITE.ctaText;

  $('serviceGrid').innerHTML = SITE.services.map(s =>
    '<div class="card"><h3>'+esc(s.name)+'</h3><p>'+esc(s.desc)+'</p><div class="price">'+esc(s.price)+'</div>' +
    '<a class="btn small" target="_blank" rel="noopener" href="'+wa("Hi, I want to order: "+s.name)+'">Order this</a></div>'
  ).join('');

  $('fItem').innerHTML = SITE.services.map(s => '<option>'+esc(s.name)+'</option>').join('');

  if (SITE.photos.length) {
    $('gallery').innerHTML = SITE.photos.map(p => '<div style="background-image:url(\''+esc(p)+'\')"></div>').join('');
  } else { $('gallerySec').style.display = 'none'; }

  if (SITE.reviews.length) {
    $('reviewGrid').innerHTML = SITE.reviews.map(r =>
      '<div class="card review">“'+esc(r.text)+'”<b>'+esc(r.by)+'</b></div>').join('');
  } else { $('reviewSec').style.display = 'none'; }

  $('contactInfo').innerHTML = esc(SITE.address) + '<br>' + esc(SITE.hours) + '<br>' + esc(SITE.phoneDisplay);
  $('footer').textContent = "© " + new Date().getFullYear() + " " + SITE.name + ". All rights reserved.";

  $('orderForm').addEventListener('submit', function(e){
    e.preventDefault();
    const msg = "Hi " + SITE.name + ",\nName: " + $('fName').value +
      "\nOrder: " + $('fItem').value + "\nDetails: " + ($('fMsg').value || "-");
    window.open(wa(msg), "_blank");
  });
})();
</script>
</body>
</html>
